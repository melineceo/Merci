# Сборка и публикация Merci.
#
# Запускается на теге вида v0.1.0 (или вручную). Собирает флатпак, кладёт
# репозиторий раздачи в ветку gh-pages — оттуда пользователи и обновляются —
# и прикладывает одиночный .flatpak к релизу.
#
# Ветка, а не artifact + deploy-pages: тем же способом публикует и
# scripts/publish-pages.sh, так что ручная выкладка и сборка на стороне
# GitHub делают ровно одно и то же.
name: Публикация

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Собрать и выложить
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Флатпак и среда выполнения
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub \
            org.gnome.Platform//50 org.gnome.Sdk//50

      - name: Сборка репозитория и одиночного файла
        run: |
          MERCI_OWNER="${{ github.repository_owner }}" bash scripts/publish.sh

      - name: Выкладка раздачи в gh-pages
        run: |
          cd dist
          rm -rf build
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions" \
              -c user.email="github-actions@users.noreply.github.com" \
              commit -qm "Раздача Merci ${GITHUB_REF_NAME}"
          git push -q --force \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" \
            gh-pages

      - name: Релиз с одиночным файлом
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          # Раздел этой версии из списка изменений — он и есть примечания к
          # релизу. Заголовки вида «## 0.1.1 — 2026-08-23»; берём всё до
          # следующего такого заголовка.
          awk -v v="$VERSION" '
            $0 ~ "^## " v " " { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md > notes.md

          # Пустой раздел — забыли описать выпуск; лучше сказать об этом
          # сразу, чем выпустить релиз без единого слова о содержимом.
          [ -s notes.md ] || {
            echo "в CHANGELOG.md нет раздела для $VERSION"
            exit 1
          }

          cat >> notes.md <<NOTES

          ## Установка и обновление

          \`\`\`bash
          flatpak remote-add --user --if-not-exists merci \\
            https://${OWNER}.github.io/Merci/merci.flatpakrepo
          flatpak install --user merci xyz.hackerstone.Merci
          \`\`\`

          Уже установленной Merci хватит \`flatpak update\`. Файл ниже — на
          случай установки без репозитория; обновляться такая установка не
          умеет.

          Полный список изменений: [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) · [English](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.en.md)
          NOTES

          # Релиз мог быть создан вручную до тега: тогда не падаем, а
          # обновляем его тем же текстом и файлом.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" \
              --title "Merci ${GITHUB_REF_NAME}" --notes-file notes.md
            gh release upload "${GITHUB_REF_NAME}" dist/Merci.flatpak --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/Merci.flatpak \
              --title "Merci ${GITHUB_REF_NAME}" --notes-file notes.md
          fi
